{% extends "base.html" %}

{% block title %}Resend Verification Email · Street Food Safety{% endblock %}

{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Resend verification email</h1>
        <p class="text-secondary mb-4">
            Enter the email address you registered with and we'll send a new
            verification link if it's still unverified.
        </p>

        <form method="post" data-no-ajax>
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" id="email" name="email" type="email"
                       autocomplete="email" maxlength="150" required>
            </div>
            <button class="btn btn-success w-100" type="submit">Send verification link</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            <a href="{{ url_for('auth.login') }}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
