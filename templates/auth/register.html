{% extends "base.html" %}

{% block title %}Register · Street Food Safety{% endblock %}

{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Create customer account</h1>
        <p class="text-secondary mb-4">Register to access public food-safety services.</p>

        <form method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="full_name">Full name</label>
                <input class="form-control" id="full_name" name="full_name" type="text"
                       value="{{ request.form.get('full_name', '') }}" autocomplete="name" maxlength="120" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" id="email" name="email" type="email"
                       value="{{ request.form.get('email', '') }}" autocomplete="email" maxlength="150" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="phone">Phone number <span class="text-secondary">(optional)</span></label>
                <input class="form-control" id="phone" name="phone" type="tel"
                       value="{{ request.form.get('phone', '') }}" autocomplete="tel" maxlength="30">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password"
                       autocomplete="new-password" minlength="8" required>
                <div class="form-text">Use at least 8 characters.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="confirm_password">Confirm password</label>
                <input class="form-control" id="confirm_password" name="confirm_password"
                       type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn-success w-100" type="submit">Create account</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
            Already registered?
            <a href="{{ url_for('auth.login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
