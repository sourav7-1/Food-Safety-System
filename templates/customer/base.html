{% extends "base.html" %}
{% block head %}<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">{% endblock %}
{% block content %}<div class="portal-shell customer-shell"><div class="portal-titlebar"><div><span>CUSTOMER PORTAL</span><h1>{% block portal_title %}{% endblock %}</h1><p>{% block portal_subtitle %}{% endblock %}</p></div><nav><a href="{{ url_for('customer_portal.search_stalls') }}"><i class="fa-solid fa-magnifying-glass"></i> Find Stalls</a><a href="{{ url_for('customer_portal.my_complaints') }}"><i class="fa-regular fa-message"></i> My Complaints</a></nav></div>{% block portal_content %}{% endblock %}</div>{% endblock %}
