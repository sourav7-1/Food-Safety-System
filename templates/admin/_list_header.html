<div class="page-actionbar">
    <div>
        <p class="eyebrow mb-1">MANAGEMENT</p>
        <h2 class="h3 fw-bold mb-1">{{ heading }}</h2>
        <p class="text-secondary mb-0">{{ description }}</p>
    </div>
    <a class="btn btn-primary action-button" href="{{ create_url }}"><i class="fa-solid fa-plus me-2"></i>{{ create_label }}</a>
</div>

<form class="search-bar" method="get">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input name="q" value="{{ search }}" placeholder="{{ search_placeholder }}" aria-label="Search">
    {% if search %}<a href="{{ clear_url }}" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></a>{% endif %}
    <button type="submit">Search</button>
</form>
