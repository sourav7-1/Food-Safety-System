{# Shared Liquid Glass SVG Refraction Filter #}
<svg width="0" height="0" class="liquid-glass-svg-defs" aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none; border: 0; clip: rect(0, 0, 0, 0);">
  <defs>
    <filter id="liquid-distort" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="912" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="55" xChannelSelector="R" yChannelSelector="G" result="displaced" />
    </filter>
  </defs>
</svg>
