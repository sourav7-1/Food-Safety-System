{% extends "base.html" %}

{% block title %}System Error (500) · DIU Food Safety System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="portal-card text-center p-4 p-md-5">
                <div class="avatar-circle-sm mx-auto mb-3" style="background: rgba(245,158,11,0.1); color: #d97706; width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-size: 1.85rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <span class="badge bg-warning-subtle text-warning px-3 py-1 rounded-pill fw-bold mb-2">HTTP 500</span>
                <h1 class="h3 fw-bold text-dark mb-2">Internal Server Error</h1>
                <p class="text-secondary mb-4">An unexpected system condition occurred while fulfilling your request. The technical team has been alerted.</p>
                
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a class="btn btn-success px-4 rounded-pill fw-semibold" href="{{ url_for('home') }}">
                        <i class="fa-solid fa-house me-1"></i> Go to Home
                    </a>
                    <button class="btn btn-outline-secondary px-4 rounded-pill fw-semibold" onclick="window.location.reload()">
                        <i class="fa-solid fa-rotate-right me-1"></i> Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
