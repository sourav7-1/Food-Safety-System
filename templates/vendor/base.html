{% extends "base.html" %}
{% block head %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
{% endblock %}

{% block content %}
<div class="portal-shell">
    <div class="portal-hero-banner">
        <div class="portal-hero-top">
            <span class="portal-badge-pill">
                <i class="fa-solid fa-shield-halved"></i> Verified Vendor Portal
            </span>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-white text-dark px-3 py-2 rounded-pill fw-bold shadow-sm" style="font-size: 0.8rem;">
                    <i class="fa-solid fa-store text-success me-1"></i> Partner Account
                </span>
            </div>
        </div>
        <div class="portal-hero-title-group">
            <h1>{% block portal_title %}{% endblock %}</h1>
            <p>{% block portal_subtitle %}{% endblock %}</p>
        </div>
    </div>
    
    <nav class="portal-nav-bar" aria-label="Vendor navigation">
        <a href="{{ url_for('vendor_portal.dashboard') }}" class="portal-nav-link {{ 'active' if request.endpoint == 'vendor_portal.dashboard' }}">
            <i class="fa-solid fa-gauge-high"></i> Dashboard
        </a>
        <a href="{{ url_for('vendor_portal.complaints') }}" class="portal-nav-link {{ 'active' if request.endpoint == 'vendor_portal.complaints' }}">
            <i class="fa-regular fa-message"></i> Complaints
        </a>
    </nav>

    {% block portal_content %}{% endblock %}
</div>
{% endblock %}
